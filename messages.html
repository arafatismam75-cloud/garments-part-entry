<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Style Wise Part</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase-config.js"></script>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebarMobile()"></div>
<button class="toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

<aside class="sidebar" id="sidebar">
  <h2>STYLE WISE <span>PART</span></h2>
  <nav>
    <a href="index.html">📊 Dashboard</a>
    <a href="profile.html">👤 Profile</a>
    <a href="messages.html" class="active">💬 Messages <span class="badge" id="msgBadge"></span></a>
    <a href="notifications.html">🔔 Notifications <span class="badge" id="notifBadge"></span></a>
  </nav>
  <div class="user-info">
    <div>👤 <span id="userEmail">—</span></div>
    <button onclick="logout()">Log out</button>
  </div>
</aside>

<main class="main-content" id="mainContent">
  <div class="topbar"><h1>Messages</h1></div>

  <div class="message-layout">
    <div class="users-list">
      <div class="search-user">
        <input id="userSearch" placeholder="🔍 Search users..." oninput="filterUsers()">
      </div>
      <div id="usersContainer"></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="no-chat">Select a user to start chatting</div>
    </div>
  </div>
</main>

<script src="js/auth-guard.js"></script>
<script>
  let allUsers = [];
  let selectedUser = null;
  let messageChannel = null;

  async function loadUsers() {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('id, full_name, email, avatar_url')
      .neq('id', currentUser.id)
      .order('full_name');

    if (error) { console.error(error); return; }
    allUsers = data || [];
    renderUsers();
  }

  function renderUsers(filter = '') {
    const q = filter.toLowerCase();
    const filtered = allUsers.filter(u =>
      (u.full_name || '').toLowerCase().includes(q) ||
      (u.email || '').toLowerCase().includes(q)
    );

    const container = document.getElementById('usersContainer');
    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty">No users found</div>';
      return;
    }
    container.innerHTML = filtered.map(u => `
      <div class="user-item ${selectedUser?.id === u.id ? 'active' : ''}" onclick="selectUser('${u.id}')">
        <img class="avatar-sm" src="${u.avatar_url || 'https://via.placeholder.com/42/2a2b30/8e8f96?text=%20'}">
        <div>
          <div class="user-name">${u.full_name || u.email}</div>
          <div class="user-email">${u.email}</div>
        </div>
      </div>
    `).join('');
  }

  function filterUsers() {
    renderUsers(document.getElementById('userSearch').value);
  }

  async function selectUser(userId) {
    selectedUser = allUsers.find(u => u.id === userId);
    renderUsers(document.getElementById('userSearch').value);

    document.getElementById('chatArea').innerHTML = `
      <div class="chat-header">
        <img class="avatar-sm" src="${selectedUser.avatar_url || 'https://via.placeholder.com/42/2a2b30/8e8f96?text=%20'}">
        <div class="chat-name">${selectedUser.full_name || selectedUser.email}</div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    `;

    await loadMessages();

    if (messageChannel) supabaseClient.removeChannel(messageChannel);
    messageChannel = supabaseClient
      .channel('messages-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const m = payload.new;
        if ((m.sender_id === currentUser.id && m.receiver_id === selectedUser.id) ||
            (m.sender_id === selectedUser.id && m.receiver_id === currentUser.id)) {
          appendMessage(m);
        }
      })
      .subscribe();
  }

  async function loadMessages() {
    const { data, error } = await supabaseClient
      .from('messages')
      .select('*')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true });

    if (error) { console.error(error); return; }
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';
    data.forEach(appendMessage);

    await supabaseClient
      .from('messages')
      .update({ is_read: true })
      .eq('sender_id', selectedUser.id)
      .eq('receiver_id', currentUser.id)
      .eq('is_read', false);

    loadUnreadBadges();
  }

  function appendMessage(m) {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    const isSent = m.sender_id === currentUser.id;
    const time = new Date(m.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = 'msg ' + (isSent ? 'sent' : 'received');
    div.innerHTML = `${m.content}<div class="msg-time">${time}</div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !selectedUser) return;

    input.value = '';
    const { error } = await supabaseClient.from('messages').insert({
      sender_id: currentUser.id,
      receiver_id: selectedUser.id,
      content
    });

    if (error) { alert('Send failed: ' + error.message); return; }

    await supabaseClient.from('notifications').insert({
      user_id: selectedUser.id,
      title: 'New message',
      body: `${userProfile?.full_name || currentUser.email}: ${content.slice(0, 50)}`,
      link: 'messages.html'
    });
  }

  window.addEventListener('userLoaded', loadUsers);
</script>
</body>
</html>
